[project]
name = "opname360"
version = "0.1.0"
description = "Opname360 API"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.1",
    "fastapi[standard]>=0.162.7",
    "psycopg[binary]>=3.3.9",
    "sqlmodel>=0.0.50",
    "typer>=0.29.1",
]

[build-system]
requires = ["uv_build>=0.12.16,<0.13.0"]
build-backend = "uv_build"

[tool.fastapi]
entrypoint = "opname360.main:app"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.5",
    "ty>=0.0.104",
]
[tool.ruff]
line-length = 79
extend-exclude = ["*.ipynb", "assets", ".claude"]

[tool.ruff.lint.pydocstyle]
convention = 'pep257'

[tool.ruff.lint]
select = ["I", "E", "W", "F", "B", "UP", "SIM", "RUF", "ANN"]
ignore = [
    "E501",   # line too long (handled by formatter)
    "RUF012", # mutable class variables (too noisy for dataclass-like patterns)
    "ANN401", # dynamic `Any` is allowed by our design
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection defaults (Depends, Security, Query, ...) are the intended pattern, not B008 bugs.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Security",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Body",
    "fastapi.Header",
    "fastapi.Cookie",
    "fastapi.Form",
]

[tool.ruff.lint.isort]
case-sensitive = true
length-sort-straight = true
lines-after-imports = 2
lines-between-types = 1
order-by-type = true
section-order = ['future', 'standard-library', 'third-party', 'local-folder', 'first-party']

[tool.ruff.format]
quote-style = "single"

[tool.pytest.ini_options]
testpaths = ["tests"]
