services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: opname360
      POSTGRES_PASSWORD: opname360
      POSTGRES_DB: opname360
    ports:
      - '5433:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U opname360']
      interval: 2s
      retries: 15

volumes:
  pgdata:
